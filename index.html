<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411">
  <meta name="description" content="sec4si 官方网站。网站正在构建中，敬请期待。">
  <title>sec4si — Coming soon</title>
  <link rel="canonical" href="https://sec4.si/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root{color-scheme:dark;--bg:#101411;--fg:#eef1e8;--muted:#a2ac9f;--accent:#d0f799;--line:#323c32}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{margin:0;color:var(--fg);font-family:Arial,"Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#b3d69905 1px,transparent 1px),linear-gradient(90deg,#b3d69905 1px,transparent 1px);background-size:64px 64px}
    a{color:inherit;text-decoration:none}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
    .page{position:relative;max-width:1440px;min-height:100svh;margin:auto;padding:0 64px;display:flex;flex-direction:column}
    header{height:112px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:24px}
    .wordmark{font-size:23px;font-weight:700;letter-spacing:-1.1px}
    .wordmark span{color:var(--accent)}
    .nav-link{font-family:Consolas,monospace;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:12px;padding:12px 0}
    .nav-link:hover{color:var(--accent)}
    main{flex:1;display:grid;grid-template-columns:1fr auto;align-items:center;gap:64px;padding:100px 0 112px}
    .eyebrow{display:flex;align-items:center;gap:10px;color:var(--accent);font:12px/1.5 Consolas,monospace;letter-spacing:1.8px;text-transform:uppercase}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px #d0f73333}
    h1{font-size:clamp(76px,11.5vw,166px);letter-spacing:-.075em;line-height:1;margin:32px 0 30px;font-weight:600}
    .cursor{display:inline-block;color:var(--accent);margin-left:.04em}
    .intro{font-size:21px;line-height:1.7;margin:0 0 10px;letter-spacing:.03em;font-weight:400}
    .description{color:var(--muted);font-size:15px;line-height:1.9;margin:0;max-width:450px}
    .cta{display:inline-flex;gap:30px;align-items:center;background:var(--accent);color:#1a2614;font-size:14px;font-weight:600;padding:17px 22px;margin-top:36px;border:1px solid var(--accent);transition:background .15s}
    .cta:hover{background:#e0ffb6}
    .symbol{width:200px;height:224px;position:relative;display:grid;place-items:center;margin-right:28px}
    .symbol::before,.symbol::after{content:"";position:absolute;inset:0;border:1px solid var(--line);clip-path:polygon(50% 0,100% 24%,100% 76%,50% 100%,0 76%,0 24%);background:linear-gradient(135deg,#d0f7990a,transparent 60%)}
    .symbol::after{inset:22px;background:none;border-color:#657456;transform:rotate(180deg)}
    .glyph{font:72px/1 Consolas,monospace;color:var(--accent);letter-spacing:-16px;margin-left:-16px;z-index:1}
    .symbol-label{position:absolute;bottom:-42px;font:10px/1.5 Consolas,monospace;color:var(--muted);letter-spacing:2px}
    footer{padding:26px 0 30px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:var(--muted);font:11px/1.7 Consolas,monospace;letter-spacing:.6px}
    footer a:hover{color:var(--accent)}
    @media(min-width:1600px){main{padding-top:140px;padding-bottom:160px}}
    @media(max-width:760px){.page{padding:0 26px}header{height:86px}.nav-link{font-size:12px}main{grid-template-columns:1fr;padding:88px 0 90px;gap:0}h1{font-size:clamp(72px,18vw,126px);margin:30px 0}.intro{font-size:19px}.description{font-size:14px}.symbol{display:none}footer{font-size:10px;flex-wrap:wrap;padding:22px 0 24px}.eyebrow{font-size:10px;letter-spacing:1.5px}}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="wordmark" href="/" aria-label="sec4si 首页">sec4si<span>.</span></a>
      <a class="nav-link" href="https://github.com/sec4si">GitHub <span aria-hidden="true">↗</span></a>
    </header>
    <main>
      <div>
        <div class="eyebrow"><span class="dot" aria-hidden="true"></span> Something is taking shape</div>
        <h1>sec4si<span class="cursor" aria-hidden="true">_</span></h1>
        <p class="intro">新的网站，正在构建。</p>
        <p class="description">这里将是 sec4si 的新起点。<br>更多内容即将上线，欢迎先到 GitHub 看看。</p>
        <a class="cta" href="https://github.com/sec4si">访问 GitHub <span aria-hidden="true">↗</span></a>
      </div>
      <div class="symbol" aria-hidden="true"><span class="glyph">&lt;/&gt;</span><span class="symbol-label">[ WORK IN PROGRESS ]</span></div>
    </main>
    <footer><span>© 2026 sec4si</span><a href="https://sec4.si/">sec4.si</a><span>COMING SOON / 敬请期待</span></footer>
  </div>
</body>
</html>
